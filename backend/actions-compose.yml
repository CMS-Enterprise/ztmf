# this file is intended to run in github actions
services:
  postgres:
    image: "postgres:16.2-alpine3.19"
    environment:
      - POSTGRES_DB
      - POSTGRES_USER
      - POSTGRES_PASSWORD
    network_mode: host
    healthcheck:
      # Check over TCP: while the image initializes the database it runs a
      # temporary server on the unix socket only, then restarts, so a socket
      # check can pass before the server the API connects to is up.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p 5432 -U admin -d ztmf"]
      interval: 5s
      timeout: 5s
      retries: 5
  api:
    depends_on:
      postgres:
        condition: service_healthy
    image: ${API_IMAGE_URI}
    environment:
      - ENVIRONMENT
      - PORT
      - DB_ENDPOINT
      - DB_PORT
      - DB_NAME
      - DB_USER
      - DB_PASS
      - DB_POPULATE
      - AUTH_HS256_SECRET
      - AUTH_HEADER_FIELD
    network_mode: host
    command:
      - "/usr/local/bin/ztmfapi"
    volumes:
      - ${WORKSPACE}:/src
