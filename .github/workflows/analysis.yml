name: Analysis

on:
  workflow_call:

jobs:
  # Detect whether this change touches Go/backend files so the Go-specific
  # Analysis jobs (lint go, snyk test) can be skipped on infra-only PRs. Outside
  # the PR-open context (a merge to main/prod, or any push) the signal is forced
  # non-empty so the Go scans always run there.
  #
  # SYNC: orchestration-dev.yml's `diff` job runs the same kind of diff to gate
  # the backend DEPLOY. This signal is an intentional SUPERSET of it - it also
  # matches go.mod and the backend/analysis workflow files so CI/dep edits re-run
  # the scans - which guarantees anything that can deploy has also been scanned.
  # Keep the shared core (the `backend/` pathspec + the `.go`/`.sum`/`Dockerfile`
  # grep) in sync across both files.
  changes:
    name: detect backend changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      backend: ${{ steps.backend.outputs.backend }}
    steps:
      - name: Check out repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Check for changes in backend/
        id: backend
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ] || [ "${{ github.event.pull_request.merged }}" = "true" ]; then
            echo "backend=always" >> $GITHUB_OUTPUT
          else
            echo "backend=$(git --no-pager diff --name-only "origin/${{ github.base_ref }}" -- backend/ .github/workflows/backend.yml .github/workflows/analysis.yml | grep -E '\.go$|go\.mod$|\.sum$|Dockerfile|workflows/(backend|analysis)\.yml' | head -n 1)" >> $GITHUB_OUTPUT
          fi

  Lint-Go:
    name: lint go
    needs: changes
    if: ${{ needs.changes.outputs.backend != '' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Staticcheck is installed and run directly rather than through
      # dominikh/staticcheck-action: the composite pins actions/cache to a
      # Node.js 20 build (upstream #22/#23, unreleased since March 2026), which
      # is the one deprecation warning left after the Node.js 24 migration, and
      # dropping it removes a third-party action from the supply chain. Go
      # "stable" mirrors the composite's install-go default: staticcheck
      # releases track the newest Go, which can run ahead of the go.mod
      # floor, and setup-go v6+ sets GOTOOLCHAIN=local so the module's
      # version would not auto-upgrade to satisfy it.
      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          cache-dependency-path: backend/go.sum

      - name: Install Staticcheck
        run: go install honnef.co/go/tools/cmd/staticcheck@v0.8.1

      # The problem matcher turns staticcheck's text output into PR annotations,
      # the same way the composite did.
      - name: LINT backend/
        working-directory: backend
        run: |
          echo "::add-matcher::${GITHUB_WORKSPACE}/.github/matchers/staticcheck.json"
          "$(go env GOPATH)/bin/staticcheck" ./...

  OpenAPI-Spec-Check:
    name: openapi spec up to date
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      # Regenerate the spec from the Go annotations (same command as
      # `make generate-openapi`) and fail if it differs from what's committed.
      # The swag version is pinned via the tool directive in backend/go.mod, so
      # CI and local generation produce byte-identical output.
      - name: Regenerate OpenAPI spec
        working-directory: backend
        run: go tool swag init -g cmd/api/main.go --dir ./ --parseInternal --v3.1 --outputTypes yaml -o ./ && mv swagger.yaml openapi.yaml

      - name: Fail if openapi.yaml is out of date
        working-directory: backend
        run: |
          if ! git diff --exit-code openapi.yaml; then
            echo "::error::backend/openapi.yaml is out of date. Run 'make generate-openapi' and commit the result."
            exit 1
          fi

      # The drift check above only proves the spec matches the annotations, not
      # that the annotations are correct. Redocly lint enforces correctness
      # (e.g. every operation must declare security). Rule relaxations live in
      # backend/redocly.yaml; the one intentional public route is acknowledged
      # in backend/.redocly.lint-ignore.yaml. Pinned to match local generation.
      - name: Lint OpenAPI spec (Redocly)
        working-directory: backend
        run: docker run --rm -v "$PWD":/work -w /work redocly/cli:2.32.2 lint openapi.yaml

  Lint-Terraform:
    name: lint terraform
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: TFLINT setup
        uses: terraform-linters/setup-tflint@1cf010d3c7aef302051ccdb68c14c5dc2efa34ef # v6.3.1

      - name: TFLINT version
        run: tflint --version

      - name: TFLINT init
        run: |
          tflint --chdir=infrastructure/ --init
          tflint --chdir=infrastructure/pr-env/ --init

      - name: TFLINT run
        run: |
          tflint --chdir=infrastructure/ -f compact
          tflint --chdir=infrastructure/pr-env/ -f compact

  Snyk-Test:
    name: snyk test
    needs: changes
    if: ${{ needs.changes.outputs.backend != '' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Install Snyk CLI
        uses: snyk/actions/setup@9adf32b1121593767fc3c057af55b55db032dc04 # v1.0.0

      - name: Snyk test
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: snyk test --print-deps --severity-threshold=high --show-vulnerable-paths=all ./backend
      
  Snyk-Code-Test:
    name: snyk code test
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Check out repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: code test
        uses: snyk/actions/golang@9adf32b1121593767fc3c057af55b55db032dc04 # v1.0.0
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          command: code test
          args: --severity-threshold=high --show-vulnerable-paths=all ./backend
      
  Snyk-IaC-Test:
    name: snyk iac test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      
      - name: iac test
        uses: snyk/actions/golang@9adf32b1121593767fc3c057af55b55db032dc04 # v1.0.0
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          command: iac test
          args: --severity-threshold=high ./infrastructure
