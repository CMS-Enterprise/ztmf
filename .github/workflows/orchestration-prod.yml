name: Orchestration PROD

on:
  pull_request:
    branches:
      - main
    types:
      - closed

# One prod run at a time across merges; a later merge already includes earlier ones.
concurrency:
  group: orchestration-prod
  cancel-in-progress: false

jobs:
  analysis:
    name: Analysis
    if: ${{ github.event.pull_request.merged }}
    uses: ./.github/workflows/analysis.yml
    secrets: inherit

  backend:
    name: Backend
    if: ${{ github.event.pull_request.merged }}
    needs:
      - analysis
    uses: ./.github/workflows/backend.yml
    with:
      environment: PROD
    secrets: inherit
      
  infrastructure:
    # One prod apply at a time; queue, do not cancel.
    concurrency:
      group: deploy-prod
      cancel-in-progress: false
    name: Infrastructure
    if: ${{ github.event.pull_request.merged }}
    needs: 
      - analysis
      - backend
    uses: ./.github/workflows/infrastructure.yml
    with:
      environment: PROD
    secrets: inherit
  