name: Orchestration DEV

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review

jobs:
  analysis:
    name: Analysis
    uses: ./.github/workflows/analysis.yml
    secrets: inherit

  diff:
    if: github.event.pull_request.draft == false
    name: Check for Changes
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.backend.outputs.backend }}
    steps:
      - name: Check out repo
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0

      # Run the backend job when backend code OR the backend workflow itself
      # changes, so edits to backend.yml (e.g. action version bumps) are
      # validated by the smoke test rather than shipping unexercised.
      #
      # SYNC: analysis.yml's `changes` job runs the same kind of diff to gate the
      # Go scans. That one is an intentional SUPERSET (it also matches go.mod and
      # analysis.yml so CI/dep edits re-run the scans); this one gates the DEPLOY
      # and is deliberately narrower. Keep the shared core (the `backend/`
      # pathspec + the `.go`/`.sum`/`Dockerfile` grep) in sync across both, or a
      # change could deploy without being scanned.
      - name: Check for changes in backend/ or its workflow
        id: backend
        run: echo "backend=$(git --no-pager diff --name-only origin/main -- backend/ .github/workflows/backend.yml | grep -E '\.go$|\.sum$|Dockerfile|workflows/backend.yml' | head -n 1)" >> $GITHUB_OUTPUT

      # Fail fast when main carries migrations this branch lacks. Deploying such
      # an image against the shared dev DB (already migrated ahead by main) hits
      # tern's BadVersionError, crash-loops, and burns the full 20m steady-state
      # timeout, so name the mismatch and the remedy here in seconds instead.
      # This is a git approximation: it cannot see a migration another open PR
      # deployed to dev without merging; that case is caught by the
      # deploy-failure diagnostics in infrastructure.yml. Context: ztmf-misc#298.
      #
      # The diff must run from the PR head, not HEAD: on pull_request events the
      # checkout is refs/pull/N/merge, whose main-side diff is empty by
      # construction. The head SHA is the merge commit's second parent, so the
      # full-history checkout already has it.
      - name: Fail fast on migrations missing from this branch
        run: |
          MISSING=$(git diff --name-only --diff-filter=A ${{ github.event.pull_request.head.sha }}...origin/main -- \
            'backend/cmd/api/internal/migrations/[0-9][0-9][0-9][0-9]*.go' | grep -v '_test' || true)
          if [ -n "$MISSING" ]; then
            echo "::error::main has migrations this branch does not include:"
            echo "$MISSING"
            echo "An image built from this branch cannot start against the dev database once main has deployed (BadVersionError crash loop, seen as the 20m tfSTABLE timeout)."
            echo "Remedy: rebase onto latest main, then push."
            exit 1
          fi
          echo "No migrations on main are missing from this branch."

      # Migrations are globally ordered state, so a PR that touches them must be
      # authored against the schema main actually has: an edited migration or a
      # schema change merged behind this branch will not show up as a missing
      # file above, but still diverges dev the moment this deploys. Require
      # currency with main instead of guessing. Only migration-touching PRs pay
      # this cost. Context: ztmf-misc#303.
      - name: Require migration-touching branches to be current with main
        run: |
          HEAD_SHA=${{ github.event.pull_request.head.sha }}
          TOUCHES=$(git diff --name-only origin/main...$HEAD_SHA -- backend/cmd/api/internal/migrations/ | head -n 1)
          BEHIND=$(git rev-list --count $HEAD_SHA..origin/main)
          if [ -n "$TOUCHES" ] && [ "$BEHIND" -gt 0 ]; then
            echo "::error::This PR touches the migrations package and is $BEHIND commit(s) behind main."
            echo "Migrations are globally ordered; a migration authored against a stale schema can collide or diverge silently at merge."
            echo "Remedy: rebase onto latest main, then push."
            exit 1
          fi
          echo "Migration currency check passed (touches=${TOUCHES:-none}, behind=$BEHIND)."

  backend:
    name: Backend
    needs:
      - analysis
      - diff
    if: ${{ github.event.pull_request.draft == false && needs.diff.outputs.backend != '' && !failure() && !cancelled() }}
    uses: ./.github/workflows/backend.yml
    with:
      environment: DEV
    secrets: inherit
     
  infrastructure:
    name: Infrastructure
    needs: 
      - analysis
      - diff
      - backend
    if: ${{ github.event.pull_request.draft == false && !failure() && !cancelled() }}
    uses: ./.github/workflows/infrastructure.yml
    with:
      environment: DEV
    secrets: inherit
  